<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Recipe Finder App</title>
  </head>
  <body>
    <div class="container">
      <h2>Recipe Finder</h2>

      <!-- Search bar section -->
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search recipes (like Chicken, pizza, pasta, more foods.)..."
          autocomplete="off"/>
        <button id="search-btn">Search</button>
      </div>

      <!-- Result container (Where recipes will be displayd in the form of cards) -->
      <div id="recipe-container" class="recipe-grid"></div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
